name: Nova Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Nova Project
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Gradle Wrapper
        run: |
          echo "Checking Gradle Wrapper..."
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          echo "Gradle Wrapper files found."

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Nova Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Nova APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
